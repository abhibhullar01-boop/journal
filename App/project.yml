# XcodeGen spec. Generate the Xcode project with:  cd App && xcodegen
# (or just run scripts/run-simulator.sh from the repo root)
name: VoiceJournal
options:
  bundleIdPrefix: com.abhibhullar
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
    CODE_SIGN_STYLE: Automatic
packages:
  JournalKit:
    path: ../JournalKit
targets:
  VoiceJournal:
    type: application
    platform: iOS
    sources:
      - path: Sources/App
      - path: Sources/Shared
    dependencies:
      - package: JournalKit
      - target: VoiceJournalWidgets
    info:
      path: Support/VoiceJournal-Info.plist
      properties:
        CFBundleDisplayName: Voice Journal
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSMicrophoneUsageDescription: Voice Journal listens while you speak so it can write down your entry.
        NSSpeechRecognitionUsageDescription: Voice Journal turns your speech into text on your iPhone so it can find tasks, skills and goals.
        CFBundleURLTypes:
          - CFBundleURLName: com.abhibhullar.VoiceJournal
            CFBundleURLSchemes: [voicejournal]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhibhullar.VoiceJournal
    scheme:
      gatherCoverageData: false
  VoiceJournalWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Widget
      - path: Sources/Shared
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Support/VoiceJournalWidgets-Info.plist
      properties:
        CFBundleDisplayName: Voice Journal
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.abhibhullar.VoiceJournal.Widgets
